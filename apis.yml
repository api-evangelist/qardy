aid: qardy
name: Qardy
description: >-
  Qardy is the first online lending aggregator marketplace in Egypt and the wider
  MENA region, connecting micro, small, and medium enterprises (MSMEs) with banks
  and financial institutions for debt financing. Its digital matchmaking platform
  collects and digitizes business and individual financial data, runs bank-statement
  and financial-statement analysis, produces credit ratings and predictive profiles,
  then matches eligible applicants to partner financial institutions by loan amount,
  industry, and risk rating. Qardy offers business loans (from EGP 50,000),
  micro-company financing (up to EGP 242,000), small and medium company financing
  (from EGP 250,000 to over EGP 10,000,000), supply chain / invoice financing,
  leasing, and factoring — free of charge to applicants through a fast, transparent
  three-step application process.
